<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Poker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="game-layout">
            <div class="left-panel">
                <div id="user-info">
                    <p>Usuario: <span id="currentUsername"></span></p>
                    <p>ID: <span id="currentUserId"></span></p>
                </div>
                <div id="credits">
                    Créditos: $<span id="creditAmount">0</span>
                </div>
                <button id="creditsBtn">Gestionar Créditos</button>
                <button id="logoutBtn">Cerrar Sesión</button>
            </div>
            <div class="center-panel">
                <div id="game-screen" class="hidden">
                    <h1>Video Poker</h1>
                    <div id="cards"></div>
                    <div id="controls">
                        <button id="dealBtn">Repartir</button>
                        <button id="drawBtn" disabled>Cambiar</button>
                        <select id="betAmount">
                            <option value="100">$100</option>
                            <option value="200">$200</option>
                            <option value="300">$300</option>
                            <option value="400">$400</option>
                            <option value="500">$500</option>
                        </select>
                    </div>
                    <div id="message"></div>
                </div>
                <div id="registration-screen">
                    <h2>Registro</h2>
                    <input type="text" id="username" placeholder="Nombre de usuario">
                    <button id="registerBtn">Registrarse</button>
                    <p id="registrationMessage"></p>
                </div>
                <div id="login-screen" class="hidden">
                    <h2>Iniciar Sesión</h2>
                    <p>Usuario guardado: <span id="savedUsername"></span></p>
                    <button id="loginBtn">Iniciar Sesión</button>
                    <p id="loginMessage"></p>
                </div>
            </div>
            <div class="right-panel">
                <button id="toggleScreenBtn">Mostrar/Ocultar Tabla de Pagos</button>
                <div id="paytable">
                    <!-- Contenido de la tabla de pagos (sin cambios) -->
                </div>
            </div>
        </div>
    </div>
    <div id="creditsModal" class="modal hidden">
        <div class="modal-content">
            <h2>Gestionar Créditos</h2>
            <input type="text" id="codeInput" placeholder="Ingresa el código">
            <button id="submitCodeBtn">Enviar Código</button>
            <hr>
            <h3>Retirar Créditos</h3>
            <input type="number" id="withdrawAmount" placeholder="Cantidad a retirar">
            <button id="withdrawBtn">Retirar</button>
            <button id="closeCreditsModalBtn" class="close-btn">&times;</button>
        </div>
    </div>
    <div id="receiptModal" class="modal hidden">
        <div class="modal-content">
            <h2>Recibo de Retiro</h2>
            <p>Usuario: <span id="receiptUsername"></span></p>
            <p>ID de Jugador: <span id="receiptPlayerId"></span></p>
            <p>Cantidad: $<span id="receiptAmount"></span></p>
            <p>Fecha: <span id="receiptDate"></span></p>
            <p>Hora: <span id="receiptTime"></span></p>
            <p>Código de Retiro: <span id="receiptCode"></span></p>
            <button id="closeReceiptBtn">Cerrar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
